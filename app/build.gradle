plugins {
    id 'com.android.application'
}

android {
    namespace 'com.israel.quickrecord'
    compileSdk 37

    defaultConfig {
        applicationId 'com.israel.quickrecord'
        minSdk 34
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            def ksFile = System.getenv("QR_KEYSTORE_FILE")
            if (ksFile != null) {
                storeFile file(ksFile)
                storeType "PKCS12"
                storePassword System.getenv("QR_KEYSTORE_PASSWORD")
                keyAlias System.getenv("QR_KEY_ALIAS")
                keyPassword System.getenv("QR_KEY_PASSWORD")
            }
        }
    }
    
    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}
