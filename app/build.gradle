plugins {
    id 'com.android.application'
}

android {
    namespace 'com.israel.quickrecord'
    compileSdk 37

    defaultConfig {
        applicationId 'com.israel.quickrecord'
        minSdk 34
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}
